name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Docker Hub mirroring activates itself once the two secrets exist
      # (DOCKERHUB_USERNAME + DOCKERHUB_TOKEN); until then the steps are skipped.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/crp4222/privaite
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror manifests to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        # Copy the freshly pushed ghcr manifest lists (multi-arch, incl. provenance)
        # to docker.io with the same tags: no rebuild, identical digests.
        run: |
          tags='${{ steps.meta.outputs.tags }}'
          src=$(echo "$tags" | head -n1)
          create_args=$(echo "$tags" | sed 's|ghcr.io/|docker.io/|' | sed 's/^/-t /' | tr '\n' ' ')
          docker buildx imagetools create $create_args "$src"

      - name: Sync Docker Hub description
        if: env.HAS_DOCKERHUB == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: crp4222/privaite
          short-description: Self-hosted LLM proxy that redacts PII before prompts leave your machine, tool calls included
          readme-filepath: ./README.md
