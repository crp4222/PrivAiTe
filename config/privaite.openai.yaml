server:
  host: "0.0.0.0"
  port: 8400
  workers: 1
  log_level: "info"

auth:
  enabled: true

providers:
  # Drop-in OpenAI: this config is selected automatically when OPENAI_API_KEY is
  # set in the environment and no config/privaite.yaml is mounted. Add more models
  # by copying a block. Uses the standard OpenAI provider via litellm.
  - model_name: "gpt-4o-mini"
    litellm_params:
      model: "openai/gpt-4o-mini"
      api_key: "${OPENAI_API_KEY}"

  - model_name: "gpt-4o"
    litellm_params:
      model: "openai/gpt-4o"
      api_key: "${OPENAI_API_KEY}"

pii:
  enabled: true
  # Full ONNX suite (default): ~84.5% recall on the benchmark, at ~543 ms average
  # in-process detection time per benchmark document (privaite-bench
  # COMPARISON.md; that is detection time on one document, not end-to-end request
  # latency, and it is hardware-dependent). Detects everything including secrets
  # and passwords; downloads the ONNX model on first run. Use "light" for the fast
  # Presidio-only path (~62% recall, ~63 ms per document on the same corpus). Do
  # NOT pin detectors.presidio.entities below on the light path: it restricts
  # detection to only those types and drops recall to ~35%.
  preset: "onnx"

  detectors:
    presidio:
      enabled: true
      languages: ["fr", "en"]
      score_threshold: 0.4
      # entities: leave unset. The onnx preset automatically scopes Presidio to
      # the types it is precise at (the ONNX model covers the rest). Only pin an
      # allowlist for advanced tuning, and never on preset: "light".

    # ONNX privacy-filter detector. This is what preset: "onnx" turns on (the
    # default). The preset enables it automatically; uncomment to tune it.
    # onnx:
    #   enabled: true
    #   model_name: "openai/privacy-filter"
    #   revision: "7ffa9a043d54d1be65afb281eddf0ffbe629385b" # immutable HF commit
    #   onnx_variant: "q4f16"     # quantized variant downloaded from Hugging Face
    #   device: "auto"            # auto, cpu, cuda, coreml/mps
    #   score_threshold: 0.5

    bert_ner:
      enabled: false
      model_name: "dslim/bert-base-NER"
      revision: "d1a3e8f13f8c3566299d95fcfc9a8d2382a9affc"
      device: "auto"
      score_threshold: 0.5

    mlmodel:
      enabled: false
      model_name: "openai/privacy-filter"
      revision: "7ffa9a043d54d1be65afb281eddf0ffbe629385b"
      device: "auto"
      torch_dtype: "float16"
      score_threshold: 0.5

    # The max preset enables this automatically. Requires: pip install 'privaite[gliner]'.
    gliner:
      enabled: false
      model_name: "urchade/gliner_multi_pii-v1"
      revision: "1fcf13e85f4eef5394e1fcd406cf2ca9ea82351d"

  merge_strategy: "union"
  overlap_resolution: "highest_score"
  on_error: "block"

  # Hard policy gate: PII types listed here cause the WHOLE request to be
  # rejected (HTTP 400) instead of being pseudonymized. Empty by default, so
  # every detected type is masked and forwarded as usual. Opt-in per type.
  block_entities: []
  # block_entities: ["US_SSN", "CREDIT_CARD"]

  anonymization:
    method: "placeholder"
    faker_locale: ["fr_FR", "en_US"]
    # Per-type overrides of the method above. BOTH are irreversible on purpose:
    # a masked card and a redacted secret never enter the reversible map, so they
    # are NOT restored in the reply (the provider sees "****************" or
    # "[SECRET]" and so do you). Every other type keeps the reversible
    # "placeholder" method and does come back. Delete this block, or set these
    # types to "placeholder", if you would rather have them restored.
    # Documented at docs/configuration.md#entity-overrides-per-type-methods.
    entity_overrides:
      CREDIT_CARD:
        method: "mask"
        masking_char: "*"
      SECRET:
        method: "redact"

  deanonymization:
    enabled: true
    # Opt-in: also restore placeholders the model re-typed imperfectly (small
    # wrong-substitution risk on lookalike spans).
    fuzzy_matching: false
    fuzzy_threshold: 0.85

  # Dry-run inspection endpoint (POST /v1/pii/inspect): returns the detections
  # for a text you submit, without forwarding anything to any provider and
  # without logging any value. For testing what gets redacted. Off by default.
  inspect:
    enabled: false

  passthrough:
    system_messages: false
    tool_calls: false

logging:
  format: "json"
  level: "info"
