[project]
name = "privaite"
version = "0.2.2"
description = "Privacy-first LLM proxy with transparent PII anonymization"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = ["privacy", "pii", "llm", "proxy", "anonymization", "openai", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",
    "litellm>=1.80.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=25.0",
    "click>=8.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "coverage>=7.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[project.scripts]
privaite = "privaite.cli:main"

[project.urls]
Homepage = "https://github.com/crp4222/PrivAiTe"
Repository = "https://github.com/crp4222/PrivAiTe"
Changelog = "https://github.com/crp4222/PrivAiTe/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["privaite*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
